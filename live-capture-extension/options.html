<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>千川直播画面采集器设置</title>
  <style>
    body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:32px;color:#15231d;background:#f5f8f6}
    main{max-width:560px;padding:24px;background:#fff;border:1px solid #dbe6e0;border-radius:16px}
    h1{font-size:20px;margin:0 0 8px} p{color:#617069} label{display:block;margin:20px 0 6px;font-weight:600}
    input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #cbd8d1;border-radius:10px}
    button{margin-top:12px;padding:10px 18px;border:0;border-radius:10px;background:#087a57;color:#fff;font-weight:600;cursor:pointer}
    #status{margin-left:10px;color:#617069}
  </style>
</head>
<body>
<main>
  <h1>千川直播画面采集器</h1>
  <p>采集器只在已登录的千川直播大屏与本机诊断服务之间传递当前场次的短时签名流地址，不保存账号密码，也不把流地址写入本地文件。</p>
  <label for="serverUrl">本机诊断服务地址</label>
  <input id="serverUrl" type="url" placeholder="http://127.0.0.1:8765">
  <button id="save" type="button">保存并测试</button><span id="status"></span>
</main>
<script src="options.js"></script>
</body>
</html>
